name: Import POS update

on:
  push:
    branches: [main]
    paths: ["mingjufish-update.zip"]

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import prepared update
        run: |
          unzip -o mingjufish-update.zip
          rm mingjufish-update.zip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build --config github_pages_src/vite.config.ts
      - name: Publish update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish attendance record updates"
          git push
